name: AI Chatbot — Automation Test Pipeline

on:
  push:
    branches: [ main, develop, release/**, feature/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Nightly regression at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run UI tests on'
        required: true
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge ]
      headless:
        description: 'Run browser headless?'
        required: true
        default: 'true'
        type: boolean
      test_groups:
        description: 'TestNG groups to run (comma-separated)'
        required: false
        default: 'smoke,functional,api,negative,security'

env:
  JAVA_VERSION: '11'
  MAVEN_OPTS: '-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1'

jobs:
  # ────────────────────────────────────────────────────────────
  #  JOB 1: Build & Smoke Tests
  # ────────────────────────────────────────────────────────────
  smoke-tests:
    name: 🚀 Build & Smoke Tests
    runs-on: ubuntu-latest
    outputs:
      smoke_passed: ${{ steps.smoke.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install Google Chrome (stable)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Smoke Tests
        id: smoke
        run: |
          mvn test \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dbrowser.headless=true \
            -Dgroups=smoke \
            -Dsurefire.suiteXmlFiles=testng.xml \
            --no-transfer-progress
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_VALID_TOKEN: ${{ secrets.API_VALID_TOKEN }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}

      - name: Upload Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-results
          path: target/allure-results
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  #  JOB 2: Functional & API Tests (parallel)
  # ────────────────────────────────────────────────────────────
  functional-api-tests:
    name: 🔧 Functional & API Tests
    runs-on: ubuntu-latest
    needs: smoke-tests

    strategy:
      matrix:
        test-group: [ functional, api ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run ${{ matrix.test-group }} Tests
        run: |
          mvn test \
            -Dbrowser=chrome \
            -Dbrowser.headless=true \
            -Dgroups=${{ matrix.test-group }} \
            -Dsurefire.suiteXmlFiles=testng.xml \
            --no-transfer-progress
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_VALID_TOKEN: ${{ secrets.API_VALID_TOKEN }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}

      - name: Upload ${{ matrix.test-group }} Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test-group }}-allure-results
          path: target/allure-results
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  #  JOB 3: Negative & Security Tests
  # ────────────────────────────────────────────────────────────
  security-negative-tests:
    name: 🔒 Security & Negative Tests
    runs-on: ubuntu-latest
    needs: smoke-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Security & Negative Tests
        run: |
          mvn test \
            -Dbrowser=chrome \
            -Dbrowser.headless=true \
            -Dgroups=security,negative \
            -Dsurefire.suiteXmlFiles=testng.xml \
            --no-transfer-progress
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_VALID_TOKEN: ${{ secrets.API_VALID_TOKEN }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}

      - name: Upload Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-allure-results
          path: target/allure-results
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  #  JOB 4: Performance Tests (nightly only)
  # ────────────────────────────────────────────────────────────
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [ functional-api-tests, security-negative-tests ]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Performance Tests
        run: |
          mvn test \
            -Dgroups=performance \
            -Dsurefire.suiteXmlFiles=testng.xml \
            --no-transfer-progress
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_VALID_TOKEN: ${{ secrets.API_VALID_TOKEN }}

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-allure-results
          path: target/allure-results
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  #  JOB 5: Allure Report Generation
  # ────────────────────────────────────────────────────────────
  generate-report:
    name: 📊 Generate Allure Report
    runs-on: ubuntu-latest
    needs: [ functional-api-tests, security-negative-tests ]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results-combined
          merge-multiple: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: allure-results-combined
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload Final Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-final
          path: allure-history
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  #  JOB 6: Notify on Failure
  # ────────────────────────────────────────────────────────────
  notify-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [ smoke-tests, functional-api-tests, security-negative-tests ]
    if: failure()

    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Chatbot Test Pipeline FAILED*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
