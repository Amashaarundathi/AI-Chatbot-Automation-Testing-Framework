# ============================================================
#   AI Chatbot Testing Framework - Configuration
# ============================================================

# --- Application URLs ---
app.base.url=http://localhost:8089
api.base.url=http://localhost:8089
api.chat.endpoint=/chat
api.health.endpoint=/health
api.auth.endpoint=/auth/token

# --- Browser Configuration ---
browser=chrome
browser.headless=false
browser.maximize=true
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# --- API Configuration ---
api.timeout=15000
api.max.retries=3
api.valid.token=Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test_valid_token
api.invalid.token=Bearer invalid_token_12345
api.expired.token=Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.expired

# --- Performance Test Configuration ---
perf.thread.count=50
perf.ramp.up.seconds=10
perf.test.duration.seconds=60
perf.acceptable.response.time.ms=3000
perf.max.error.rate.percent=5

# --- Screenshot Configuration ---
screenshot.on.failure=true
screenshot.path=screenshots/

# --- Reporting ---
report.output.path=reports/
extent.report.path=reports/ExtentReport.html
allure.results.dir=target/allure-results

# --- Logging ---
log.level=INFO
log.output.path=logs/

# --- Test Data ---
test.data.path=src/test/resources/testdata/

# --- Environment ---
environment=QA
